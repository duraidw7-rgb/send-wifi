html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--tx);font-size:15px}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header h1{font-size:19px}header small{display:block;color:var(--mut);font-size:11px}
.pill{background:var(--soft);color:var(--pri);border-radius:20px;padding:3px 12px;font-size:12px}
#content{flex:1;overflow:auto;padding:4px 14px 14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:11px 4px;font-size:12px;cursor:pointer}
nav button.on{color:var(--pri);font-weight:700}nav span{display:block;font-size:20px}
button{font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.ghost{background:none}button.wide{width:100%}
.row2{display:flex;gap:8px;margin:8px 0}.row2>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px}.item .g{flex:1;min-width:0}
.item b{display:block;word-break:break-word}.item small{color:var(--mut);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}.dot.off{background:var(--mut)}
.mut{color:var(--mut);font-size:13px;line-height:1.7}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
input,textarea{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);outline:none}
textarea{height:110px;direction:ltr;font-family:monospace;font-size:11px;word-break:break-all}
dialog{max-height:92vh;overflow:auto;border:0;border-radius:18px;padding:18px;width:min(92vw,460px);background:var(--card);color:var(--tx);margin:auto}
dialog::backdrop{background:#0a1a3a88}dialog h3{font-size:15px;margin:6px 0}
.act{margin-top:12px}summary{cursor:pointer;margin:8px 0}a.lnk{color:var(--pri);text-decoration:none}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1c2a3f;color:#fff;padding:9px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;font-size:13px;z-index:9}
#toast.on{opacity:1}
.big{font-size:44px;font-weight:700;letter-spacing:8px;text-align:center;direction:ltr;margin:10px 0}
input.big{font-size:36px}

function drawQR(id,text){
 const c=$('#'+id);if(!c)return;
 try{const q=new QRCode(-1,QRErrorCorrectLevel.L);q.addData(text);q.make();
  const n=q.getModuleCount(),sc=Math.max(2,Math.floor(340/(n+8))),S=(n+8)*sc;c.width=c.height=S;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+4)*sc,(r+4)*sc,sc,sc);
  c.style.cssText='width:100%;max-width:360px;display:block;margin:8px auto;image-rendering:pixelated;border-radius:8px'}
 catch(e){c.outerHTML='<p class="mut">الكود طويل جداً لعرضه كباركود، استخدم النسخ أو المشاركة.</p>'}}
function showHost(p){
 sheet(`<h3>1) اجعل الجهاز الآخر يمسح هذا الباركود</h3><canvas id="qr"></canvas><details><summary class="mut">أو أرسل الكود كنص</summary>${codeBox('c1',p.code)}</details><h3 style="margin-top:12px">2) ثم اقرأ باركود الرد</h3><button class="pri wide" data-a="scanans" data-p="${p.id}">📷 مسح باركود الرد</button><details><summary class="mut">أو الصق كود الرد كنص</summary><textarea id="c2" placeholder="الصق هنا"></textarea><button class="wide" data-a="finish" data-p="${p.id}" style="margin-top:8px">اتصال</button></details>`);
 drawQR('qr',p.code)}
async function pairHost(){
 const p=newPeer();sheet('<h3>جارٍ تجهيز الباركود...</h3>');
 try{wire(p,p.pc.createDataChannel('nf'));await p.pc.setLocalDescription(await p.pc.createOffer());await waitIce(p.pc);p.code=await enc(p.pc.localDescription);showHost(p)}
 catch(e){drop(p);sheet('<h3>تعذّر إنشاء الباركود</h3><p class="mut">'+esc(e.message)+'</p>')}}
function pairJoin(){sheet(`<h3>امسح الباركود الظاهر على الجهاز الأول</h3><button class="pri wide" data-a="scanoffer">📷 مسح الباركود</button><details><summary class="mut">أو الصق الكود كنص</summary><textarea id="c1" placeholder="الصق هنا"></textarea><button class="wide" data-a="mkans" style="margin-top:8px">إنشاء كود الرد</button></details>`)}
async function mkAnswer(codeIn){
 const v=(codeIn||($('#c1')?$('#c1').value:'')).trim();if(!v)return toast('امسح الباركود أو الصق الكود أولاً');
 sheet('<h3>جارٍ تجهيز الرد...</h3>');let p;
 try{const o=await dec(v);p=newPeer();p.pc.ondatachannel=e=>wire(p,e.channel);await p.pc.setRemoteDescription(o);await p.pc.setLocalDescription(await p.pc.createAnswer());await waitIce(p.pc);const c=await enc(p.pc.localDescription);
  sheet(`<h3>اعرض هذا الباركود للجهاز الأول ليمسحه</h3><canvas id="qr"></canvas><details><summary class="mut">أو أرسل الكود كنص</summary>${codeBox('c1',c)}</details><p class="mut">بعد أن يقرأه الجهاز الأول يتم الاتصال تلقائياً.</p>`);drawQR('qr',c)}
 catch(e){if(p)drop(p);toast('الكود غير صحيح');pairJoin()}}
async function finish(id,codeIn){
 const p=peers.find(x=>x.id===id),v=(codeIn||($('#c2')?$('#c2').value:'')).trim();if(!p||!v)return toast('اقرأ باركود الرد أو الصق الكود');
 try{await p.pc.setRemoteDescription(await dec(v));sheet('<h3>جارٍ الاتصال...</h3><p class="mut">إذا لم يتم الاتصال خلال ثوانٍ فقد تمنعه شبكة أحد الجهازين (خاصة بيانات الموبايل)؛ جرّب نفس الواي فاي.</p>')}
 catch(e){toast('كود الرد غير صحيح');showHost(p)}}
function copy(id){const t=$('#'+id);t.select();t.setSelectionRange(0,999999);let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('تم النسخ'),()=>toast('حدد النص وانسخه يدوياً'));else toast(ok?'تم النسخ':'حدد النص وانسخه يدوياً')}
function share(id){const v=$('#'+id).value;if(navigator.share)navigator.share({text:v}).catch(()=>{});else copy(id)}

/* ---------- قراءة الباركود ---------- */
let scanStream=null,scanTimer=null,scanBack=null,scanDet=null;
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
const loadJsQR=()=>window.jsQR?Promise.resolve():new Promise((ok,no)=>{const u=['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'];let i=0;
 const t=()=>{if(i>=u.length)return no(new Error('jsqr'));const s=document.createElement('script');s.src=u[i++];s.onload=()=>window.jsQR?ok():t();s.onerror=t;document.head.appendChild(s)};t()});
async function getDec(){
 if(scanDet)return scanDet;
 if(window.BarcodeDetector){try{const bd=new BarcodeDetector({formats:['qr_code']});scanDet=async s=>{const r=await bd.detect(s);return r[0]?r[0].rawValue:null};return scanDet}catch(e){}}
 await loadJsQR();
 scanDet=async s=>{const w=s.videoWidth||s.naturalWidth||s.width,h=s.videoHeight||s.naturalHeight||s.height;if(!w)return null;
  const k=Math.min(1,1000/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext('2d');x.drawImage(s,0,0,c.width,c.height);const im=x.getImageData(0,0,c.width,c.height),r=window.jsQR(im.data,im.width,im.height);return r?r.data:null};
 return scanDet}
async function scanQR(cb,back){
 scanBack=back;
 sheet(`<h3>وجّه الكاميرا نحو الباركود</h3><video id="vid" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000;max-height:50vh"></video><p class="mut" id="smsg">جارٍ تشغيل الكاميرا...</p><div class="row2"><button data-a="photo">📷 التقاط صورة</button><button data-a="scanback">رجوع</button></div><input type="file" id="ph" accept="image/*" capture="environment" hidden>`);
 let det=null;try{det=await getDec()}catch(e){const m=$('#smsg');if(m)m.textContent='تعذّر تحميل قارئ الباركود (يحتاج إنترنت مرة واحدة). استخدم النسخ واللصق.'}
 const done=v=>{stopScan();cb(v)};
 const ph=$('#ph');if(!ph)return;
 ph.onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!det)return toast('قارئ الباركود غير متاح');
  try{const im=new Image();im.src=URL.createObjectURL(f);await im.decode();const v=await det(im);v?done(v):toast('لم أستطع قراءة الباركود، قرّب الصورة وحاول مرة ثانية')}catch(x){toast('تعذّر قراءة الصورة')}};
 try{
  scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  const v=$('#vid');if(!v){stopScan();return}
  v.srcObject=scanStream;await v.play();const m=$('#smsg');if(m)m.textContent='جارٍ البحث عن باركود...';
  if(det)scanTimer=setInterval(async()=>{try{const r=await det(v);if(r)done(r)}catch(e){}},300)}
 catch(e){const m=$('#smsg');if(m)m.textContent='تعذّر تشغيل الكاميرا. اسمح للمتصفح باستخدامها، أو التقط صورة للباركود بالزر أدناه.'}}

/* ---------- الواجهة ---------- */
/* ---------- الربط برقم من 5 خانات (عبر خادم وسيط مجاني) ---------- */
const RELAY='https://ntfy.sh/',qTopic=(c,k)=>'netfilesq'+c+k;
let qSub=null,qTimer=null,qPeer=null,qAns=null;
function qStop(){if(qSub){qSub.close();qSub=null}clearTimeout(qTimer);qTimer=null}
async function relayPost(t,text){const r=await fetch(RELAY+t,{method:'POST',body:text});if(!r.ok)throw new Error('relay '+r.status)}
async function relayGet(t){
 const r=await fetch(RELAY+t+'/json?poll=1&since=all');if(!r.ok)throw new Error('relay '+r.status);
 const ev=(await r.text()).split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(x=>x&&x.event==='message');
 const m=ev[ev.length-1];return m&&Date.now()/1000-m.time<600?m.message:null}
async function qHost(){
 qStop();sheet('<h3>جارٍ تجهيز الرقم...</h3>');const p=newPeer(true);qPeer=p;
 try{
  wire(p,p.pc.createDataChannel('nf'));await p.pc.setLocalDescription(await p.pc.createOffer());await waitIce(p.pc);
  const offer=await enc(p.pc.localDescription);let code=null;
  for(let i=0;i<6&&!code;i++){const c=String(Math.floor(10000+Math.random()*90000));if(!(await relayGet(qTopic(c,'o')))&&!(await relayGet(qTopic(c,'a'))))code=c}
  if(!code)throw new Error('busy');
  await relayPost(qTopic(code,'o'),offer);
  sheet(`<h3>اكتب هذا الرقم في الجهاز الثاني</h3><div class="big">${code}</div><p class="mut">بانتظار الجهاز الثاني... يجب أن يكون الجهازان متصلين بالإنترنت (من أي مكان).</p>`);
  qSub=new EventSource(RELAY+qTopic(code,'a')+'/sse');
  qSub.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.event!=='message'||!m.message)return;
   qStop();qAns=m.message;
   sheet('<h3>جهاز يطلب الاتصال بك</h3><p class="mut">اضغط «قبول» فقط إذا كنت أنت من كتب الرقم على الجهاز الثاني.</p><div class="row2"><button class="pri" data-a="qacc">✔ قبول</button><button data-a="qrej">✖ رفض</button></div>')};
  qTimer=setTimeout(()=>{qStop();if(qPeer&&!qPeer.open){drop(qPeer);qPeer=null;if(dlg.open)sheet('<h3>انتهت المهلة</h3><p class="mut">لم يُدخل أحد الرقم خلال 5 دقائق. أعد المحاولة.</p>')}},300000)}
 catch(e){drop(p);qPeer=null;qFail(e)}}
function qFail(e){const net=e&&e.name==='TypeError';
 sheet(`<h3>تعذّر الربط بالرقم</h3><p class="mut">${net?'تعذّر الاتصال بالخادم الوسيط: إما لا يوجد إنترنت، أو الصفحة مفتوحة من مكان يمنع الاتصال (معاينة الملفات أو تطبيق الدردشة، أو رابط claude.ai). افتحها في المتصفح نفسه (Chrome أو Safari) من عنوان ويب أو كملف مباشر.':'حدث خطأ غير متوقع.'}</p><p class="mut" dir="ltr" style="text-align:left">${esc(((e&&e.name)||'Error')+': '+((e&&e.message)||''))}</p><button class="pri wide" data-a="host">استخدم الباركود بدلاً (بدون إنترنت)</button>`)}
async function qAccept(){const p=qPeer;if(!p||!qAns)return;
 try{await p.pc.setRemoteDescription(await dec(qAns));sheet('<h3>جارٍ الاتصال...</h3><p class="mut">إذا لم يتم الاتصال خلال ثوانٍ فقد تمنعه شبكة أحد الجهازين (خاصة بيانات الموبايل)؛ جرّب نفس الواي فاي.</p>')}
 catch(e){drop(p);qPeer=null;toast('تعذّر الاتصال');dlg.close()}}
function qReject(){if(qPeer)drop(qPeer);qPeer=null;dlg.close()}
function qJoin(){sheet('<h3>اكتب الرقم الظاهر على الجهاز الأول</h3><input id="qn" class="big" inputmode="numeric" maxlength="5" dir="ltr" placeholder="00000"><button class="pri wide" data-a="qgo" style="margin-top:10px">اتصال</button>');setTimeout(()=>{const i=$('#qn');if(i)i.focus()},150)}
async function qGo(){
 const code=(($('#qn')||{}).value||'').replace(/\D/g,'');if(code.length!==5)return toast('اكتب 5 أرقام');
 sheet('<h3>جارٍ البحث عن الجهاز الأول...</h3>');let p;
 try{const offer=await relayGet(qTopic(code,'o'));if(!offer){toast('الرقم غير صحيح أو انتهت صلاحيته');return qJoin()}
  const o=await dec(offer);p=newPeer(true);qPeer=p;p.pc.ondatachannel=e=>wire(p,e.channel);
  await p.pc.setRemoteDescription(o);await p.pc.setLocalDescription(await p.pc.createAnswer());await waitIce(p.pc);
  await relayPost(qTopic(code,'a'),await enc(p.pc.localDescription));
  sheet('<h3>بانتظار موافقة الجهاز الأول...</h3><p class="mut">اضغط «قبول» على الجهاز الأول. إذا لم يتم الاتصال خلال دقيقة فقد تمنعه شبكة أحد الجهازين (خاصة بيانات الموبايل)؛ جرّب نفس الواي فاي.</p>')}
 catch(e){if(p){drop(p);qPeer=null}qFail(e)}}
dlg.addEventListener('close',()=>{qStop();if(qPeer&&!qPeer.open)drop(qPeer);qPeer=null});

function render(){
 const open=peers.filter(p=>p.open).length;$('#cnt').textContent='● متصل ('+open+')';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 const c=$('#content');
 if(tab==='dev'){
  const vp=peers.find(p=>p.id===view);
  if(vp){c.innerHTML=`<div class="row2"><button data-a="back">→ رجوع</button><button data-a="rm" data-p="${vp.id}">فصل الجهاز</button></div><div class="card"><div class="item"><i class="dot${vp.open?'':' off'}"></i><div class="g"><b>💻 ${esc(vp.name)}</b><small>${vp.open?'متصل':'منقطع'} · ${vp.files.length} ملف مشترك</small></div></div></div>`+
   (vp.files.length?vp.files.map(f=>`<div class="card"><div class="item"><div class="g"><b>📄 ${esc(f.name)}</b><small>${fmt(f.size)}</small>${vp.prog[f.id]!=null?`<div class="bar"><i style="width:${Math.round(vp.prog[f.id]*100)}%"></i></div>`:''}</div><button class="pri" data-a="get" data-p="${vp.id}" data-f="${f.id}" ${vp.open&&vp.prog[f.id]==null?'':'disabled'}>⬇️ تحميل</button></div></div>`).join(''):'<p class="mut" style="text-align:center;margin-top:30px">لا توجد ملفات مشتركة عند هذا الجهاز</p>')}
  else c.innerHTML=`<div class="row2"><button class="pri" data-a="qhost">🔢 أعطني رقماً</button><button class="pri" data-a="qjoin">⌨️ عندي رقم</button></div><details class="mut" style="margin-bottom:6px"><summary>ربط بدون إنترنت (باركود أو كود)</summary><div class="row2"><button data-a="host">＋ عرض باركود</button><button data-a="join">📥 عندي باركود/كود</button></div></details>`+
   (peers.length?peers.map(p=>`<div class="card" data-a="open" data-p="${p.id}"><div class="item"><i class="dot${p.open?'':' off'}"></i><div class="g"><b>💻 ${esc(p.name)}</b><small>${p.open?p.files.length+' ملف مشترك':'بانتظار الاتصال...'}</small></div><span>‹</span></div></div>`).join('')
   :`<div class="card"><b>كيف أربط جهازين؟</b><p class="mut">1) على الجهاز الأول اضغط «أعطني رقماً» فيظهر رقم من 5 خانات.<br>2) على الجهاز الثاني اضغط «عندي رقم» واكتب الرقم.<br>3) على الجهاز الأول اضغط «قبول». تم الاتصال.<br><br>يحتاج الجهازان إنترنت من نفس الراوتر. بدون إنترنت استخدم الباركود.</p></div>`)}
 else if(tab==='my'){
  c.innerHTML=`<div class="card"><label class="mut">اسم جهازي</label><input id="nm" value="${esc(me.name)}"></div><button class="pri wide" data-a="add" style="margin-top:10px">⬆️ إضافة ملفات للمشاركة</button>`+
   (mine.length?mine.map(x=>`<div class="card"><div class="item"><div class="g"><b>📄 ${esc(x.file.name)}</b><small>${fmt(x.file.size)}</small></div><button data-a="del" data-f="${x.id}">✕</button></div></div>`).join(''):'<p class="mut" style="text-align:center;margin-top:30px">لم تضف ملفات بعد. الملفات التي تضيفها يراها المتصلون ويحملونها.</p>')+
   '<p class="mut" style="margin-top:14px">تنبيه: الملفات تبقى مشتركة ما دامت هذه الصفحة مفتوحة، وتختفي عند إغلاقها.</p>'}
 else c.innerHTML=logs.length?logs.map(l=>`<div class="card"><small class="mut">${new Date(l.t).toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}</small> ${esc(l.m)}${l.url?` <a class="lnk" href="${l.url}" download="${esc(l.name)}">⬇️ حفظ</a>`:''}</div>`).join(''):'<p class="mut" style="text-align:center;margin-top:40px">لا يوجد نشاط بعد</p>'}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;view=null;render();return}
 const a=e.target.closest('[data-a]');if(!a)return;const d=a.dataset,A=d.a;
 if(A==='qhost')qHost();else if(A==='qjoin')qJoin();else if(A==='qgo')qGo();else if(A==='qacc')qAccept();else if(A==='qrej')qReject();else if(A==='host')pairHost();else if(A==='join')pairJoin();else if(A==='mkans')mkAnswer();else if(A==='scanans'){const p=peers.find(x=>x.id===d.p);scanQR(c=>finish(d.p,c),()=>p&&showHost(p))}else if(A==='scanoffer')scanQR(c=>mkAnswer(c),pairJoin);else if(A==='scanback'){stopScan();(scanBack||(()=>dlg.close()))()}else if(A==='photo'){const f=$('#ph');if(f)f.click()}else if(A==='finish')finish(d.p);
 else if(A==='copy')copy(d.t);else if(A==='share')share(d.t);else if(A==='close')dlg.close();
 else if(A==='open')view=d.p,render();else if(A==='back')view=null,render();
 else if(A==='rm')drop(peers.find(p=>p.id===d.p));
 else if(A==='get'){const p=peers.find(x=>x.id===d.p);const f=p&&p.files.find(x=>x.id===d.f);if(f)request(p,f)}
 else if(A==='add')$('#fIn').click();
 else if(A==='del'){mine=mine.filter(x=>x.id!==d.f);bcast({t:'files',items:pub()});render()}});
$('#fIn').onchange=e=>{[...e.target.files].forEach(f=>mine.push({id:uid(),file:f}));e.target.value='';bcast({t:'files',items:pub()});toast('تمت الإضافة للمشاركة');render()};
document.addEventListener('change',e=>{if(e.target.id==='nm'){me.name=e.target.value.trim()||me.name;try{localStorage.setItem('nf_name',me.name)}catch(x){}bcast({t:'hello',name:me.name})}});
if(!window.RTCPeerConnection)$('#content').innerHTML='<div class="card"><b>المتصفح لا يدعم الاتصال المباشر</b><p class="mut">افتح الصفحة في Chrome أو Safari حديث.</p></div>';else render();
</script>
